<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            display: flex;
            justify-content: center;    
            align-items: center;
            height: 100%;
        }

        h1{
            font-size: 100px;
            color: red;
            height: 100vh;
        }
    </style>
</head>
<body>
    <h1></h1>

    <script>
        let h1 = document.querySelector("h1");
        window.addEventListener("keydown",function(ddd){
            h1.textContent = ddd.key;
            
        })
    </script>
</body>
</html>
