<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>time concept</title>
</head>
<body>
    <script>
        let count = 10;
        let intervals = setInterval(function(){
            if (count>=1){
                count--;
            console.log(count);
            }
            else{
                clearInterval(intervals);
            }
            
        },1000);
    </script>
</body>
</html>
